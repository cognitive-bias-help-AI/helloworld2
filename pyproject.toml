[project]
name = "investment-review"
version = "0.1.0"
description = "투자 판단 검토 시스템 — DDR v2.2 FROZEN"
requires-python = ">=3.12"

# 🔴 pydantic 은 핀 버전이다. DDR §1 의 실행 검증이 2.13.3 에서 나온 값이고,
#    frozen.py 는 Annotated[str, StringConstraints] + Field(max_length) 결합이
#    실제로 먹는지에 의존한다(raw_span 500자 상한). 마이너 업그레이드가 이걸 조용히
#    바꾸면 D-28 컨텍스트 예산의 근간이 사라진다. 올릴 때는 회귀 39건을 먼저 돌린다.
dependencies = [
    "pydantic==2.13.3",
    "langgraph>=0.2",
    "anthropic>=0.60",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ 는 참고 산출물(설계 시점 스크립트)이다. 실행 경로가 아니므로 린트하지 않는다.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 한글 주석이 길어 E501 이 자주 걸린다. 계약 문서 역할이므로 예외.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 🔴 frozen.py 는 3인 approve 없이 수정 금지다. ruff 가 지적하는 두 건은
#    고치려면 frozen 을 열어야 하므로 여기서 예외 처리한다. 승인 대상 목록이다.
#      UP037  Annotated 안의 전방참조 문자열("CitationRef" 등) — 제거하면
#             _validate_evidence_partition 의 시그니처 의미가 바뀔 수 있다
#      UP042  class X(str, Enum) → StrEnum 권고. 바꾸면 직렬화 동작이 달라질 수 있고
#             ReasonCode 27종 · SourceTrace 7종 회귀가 통째로 흔들린다
"app/schemas/frozen.py" = ["UP037", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# uv.package=false 라 app 이 설치되지 않는다. 저장소 루트를 sys.path 에 넣어
# `from app.models import registry` 가 되게 한다.
pythonpath = ["."]
markers = [
    "postgres: docker-compose 의 postgres 가 필요하다. 없으면 skip",
    "live: 실제 provider 를 호출한다. 기본 실행에서 제외",
]
